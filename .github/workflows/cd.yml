name: Build and Deploy Serverless Function

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      DEPLOY_DIR: /opt/soat15-serverless

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync to stable deploy directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete ./ "$DEPLOY_DIR"/
          mkdir -p "$DEPLOY_DIR/logs"

      - name: Write .env from secrets
        env:
          DB_HOST:     ${{ vars.DB_HOST }}
          DB_PORT:     ${{ vars.DB_PORT }}
          DB_NAME:     ${{ vars.DB_NAME }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET:  ${{ secrets.JWT_SECRET }}
        run: |
          tee "$DEPLOY_DIR/.env" > /dev/null << EOF
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          EOF

      - name: Stop previous instance
        run: |
          if [ -f "$DEPLOY_DIR/serverless.pid" ]; then
            kill "$(cat "$DEPLOY_DIR/serverless.pid")" 2>/dev/null || true
            sleep 2
          fi

      - name: Start serverless offline
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          nohup npx serverless offline start > "$DEPLOY_DIR/logs/out.log" 2>&1 &
          echo $! > "$DEPLOY_DIR/serverless.pid"
          disown